<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>My Blog Platform</h1>
        <p>Share your thoughts with the world</p>
    </header>

    <div class="form-card">
        <h2 id="form-title">Create New Post</h2>
        <input type="hidden" id="post-id">

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" placeholder="What's on your mind?">
        </div>

        <div class="form-group">
            <label>Author</label>
            <input type="text" id="author" placeholder="Your name (optional)">
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea id="body" rows="4" placeholder="Write something amazing..."></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="savePost()">Publish Post</button>
            <button class="btn-secondary" onclick="resetForm()">Cancel</button>
        </div>
    </div>

    <div id="posts-container" class="posts-grid">
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/blogs';

    document.addEventListener('DOMContentLoaded', loadPosts);

    async function loadPosts() {
        try {
            const response = await fetch(API_URL);
            const posts = await response.json();
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="empty-state">No posts yet. Be the first to write something!</div>';
                return;
            }

            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post-card';

                const date = new Date(post.createdAt).toLocaleDateString('en-US', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });

                postDiv.innerHTML = `
                        <div class="post-header">
                            <h3>${post.title}</h3>
                            <span class="post-date">${date}</span>
                        </div>
                        <div class="post-author">by <strong>${post.author}</strong></div>
                        <p class="post-body">${post.body}</p>
                        <div class="post-actions">
                            <button class="btn-icon edit" onclick="editPost('${post._id}')">
                                ✏️ Edit
                            </button>
                            <button class="btn-icon delete" onclick="deletePost('${post._id}')">
                                🗑️ Delete
                            </button>
                        </div>
                    `;
                container.appendChild(postDiv);
            });
        } catch (error) {
            console.error('Error loading posts:', error);
            document.getElementById('posts-container').innerHTML = '<div class="error-state">Failed to load posts. Is the server running?</div>';
        }
    }

    async function savePost() {
        const id = document.getElementById('post-id').value;
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const body = document.getElementById('body').value;

        if (!title || !body) {
            alert('Title and Body are required!');
            return;
        }

        const data = { title, author, body };

        try {
            let response;
            if (id) {
                response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }

            if (response.ok) {
                resetForm();
                loadPosts();
            } else {
                const err = await response.json();
                alert('Error: ' + err.message);
            }
        } catch (error) {
            console.error('Error saving post:', error);
            alert('Failed to connect to server.');
        }
    }

    async function deletePost(id) {
        if (!confirm('Are you sure you want to delete this post?')) return;

        try {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadPosts();
        } catch (error) {
            console.error('Error deleting post:', error);
        }
    }

    async function editPost(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            const post = await response.json();

            document.getElementById('post-id').value = post._id;
            document.getElementById('title').value = post.title;
            document.getElementById('author').value = post.author;
            document.getElementById('body').value = post.body;
            document.getElementById('form-title').innerText = 'Edit Post';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
            console.error('Error fetching post details:', error);
        }
    }

    function resetForm() {
        document.getElementById('post-id').value = '';
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('body').value = '';
        document.getElementById('form-title').innerText = 'Create New Post';
    }
</script>
</body>
</html>
